format = """
$os$username$sudo${custom.ssh_from}\
$hostname\
$directory\
$git_branch$git_state$git_status\
$c$rust$golang$java$python$conda\
$cmd_duration$time\
$line_break\
$env_var$character
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
format = '[ $user ]($style)'
disabled = false

[custom.ssh_from]
command = 'echo "$SSH_CONNECTION" | awk "{print \$1}"'
when = 'test -n "$SSH_CONNECTION"'
format = 'from [$output](bold red) '

[sudo]
disabled = false
symbol = "🧙"
format = '[as $symbol ]($style)'

# Replace the '❯' symbol in the prompt with '➜'
# [character] # The name of the module we are configuring is 'character'
# success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'
# error_symbol = "[➜](red)"
# vimcmd_symbol = '[V](bold green)'

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
disabled = false # Disabled by default

[os.symbols]
Arch = "󰣇"
Debian = "🌀"
Macos = ""

[directory]
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
format = '[ $symbol $context ]($style)'

[git_branch]
symbol = ""
format = '[ $symbol $branch ]($style)'

[git_status]
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
format = '[ $symbol ($version) ]($style)'

[python]
symbol = " "
format = '[ ${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
python_binary = 'python'
version_format = 'v${raw}'

[conda]
disabled = false
ignore_base = false
symbol = "🅒 "
format = '[ $symbol$environment ]'

[time]
disabled = false
# time_format = "%R" # Hour:Minute Format
format = '[  $time ]($style)'


[cmd_duration]
min_time = 100
format = '[ took $duration]($style)'
